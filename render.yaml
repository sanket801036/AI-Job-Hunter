# Render Blueprint: the "Deploy to Render" button in the README reads this file.
# Secrets are marked sync: false, so Render asks for them during setup and never reads them from git.
services:
  - type: web
    name: ai-job-hunter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL          # Neon Postgres connection string
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GITHUB_TOKEN          # optional: classic token with "repo" scope, lets the dashboard start scans on GitHub Actions
        sync: false
      - key: GITHUB_REPO           # your fork, e.g. your-name/AI-Job-Hunter
        sync: false
