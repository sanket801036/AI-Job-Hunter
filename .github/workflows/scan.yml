name: Scan LinkedIn jobs

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:         # "Run workflow" button for a manual run

concurrency:
  group: scan
  cancel-in-progress: false  # never run two scans at once

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one scan
        run: python -m app.pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_PROVIDERS: gemini,gemini2,groq,mistral,cerebras
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS || 'AI Engineer,GenAI Engineer,LLM Engineer' }}
          SEARCH_HOURS: ${{ vars.SEARCH_HOURS || '6' }}
