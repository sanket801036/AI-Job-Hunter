name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # the plugin turns a failing test into an annotation on the commit, so it is easy to spot
      - run: pip install -r requirements.txt pytest-github-actions-annotate-failures

      # tests use a throwaway sqlite file and mock every network call, so no secrets are needed
      - run: python -m pytest -q
